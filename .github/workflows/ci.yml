name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: validate + offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: odc validate
      - run: pytest -m "not live" -q

  contracts-changed:
    name: live contract tests for changed sources
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Determine changed sources
        id: changed
        run: echo "ids=$(python scripts/changed_sources.py origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"
      - name: Run contract tests
        if: steps.changed.outputs.ids != ''
        run: odc contract ${{ steps.changed.outputs.ids }}
