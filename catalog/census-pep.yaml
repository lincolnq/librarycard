schema_version: 1
id: census-pep
name: Population Estimates Program (PEP) — National, State and County Population Totals and Components of Change
publisher:
  name: U.S. Census Bureau
  url: https://www.census.gov
  type: us_federal
homepage: https://www.census.gov/programs-surveys/popest.html
description: >-
  The Census Bureau's official annual estimates of the resident population on July 1 for the nation, regions,
  divisions, states and counties, with the demographic components of change (births, deaths, natural change,
  international and domestic migration, residual) and group-quarters population. Estimates are produced with
  the cohort-component method from the 2020 Census base plus administrative records (vital statistics, IRS,
  Medicare, ACS-based migration). Each annual vintage revises the whole series back to 2020. Data Commons carries
  headline county populations; this source adds the full components-of-change detail and explicit vintages.
domains: [demographics]
tags: [census, pep, population-estimates, components-of-change, births, deaths, migration, domestic-migration, international-migration, vintage, county-population]
coverage:
  geography: United States — nation, 4 regions, 9 divisions, 50 states, DC and Puerto Rico (state level), and all counties/county-equivalents (no Puerto Rico municipios)
  countries: [US]
  geographic_granularity: [nation, census_region, census_division, state, county]
  time_range:
    start: "2020"
    end: "2025"
    notes: Vintage 2025 (released Dec 2025 / Mar 2026) covers July 1, 2020 through July 1, 2025 plus the April 1, 2020 estimates base. The adapter serves 2020s vintages 2021 onward; 2010s vintages and intercensal series use other layouts and are not served.
  temporal_granularity: annual
  unit_of_observation: Geographic area × vintage (wide columns, one per measure and year)
access:
  method: bulk_download
  endpoints:
    - url: https://www2.census.gov/programs-surveys/popest/datasets/
      description: Vintage directories 2020-<V>/; the adapter picks the highest V unless `vintage` is given.
    - url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/counties/totals/co-est2025-alldata.csv
      description: County (and state) totals and components, pattern 2020-<V>/counties/totals/co-est<V>-alldata.csv (latin-1).
    - url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/state/totals/NST-EST2025-ALLDATA.csv
      description: Nation/region/division/state (incl. PR) totals and components, pattern 2020-<V>/state/totals/NST-EST<V>-ALLDATA.csv (case varies by vintage).
  formats: [csv]
  rate_limits: None published. County file ~2 MB, state file ~55 KB; cached 30 days (license allows).
  auth: none
update:
  cadence: annual
  expected_lag: State/national totals ~6 months after the July 1 reference date (December); county totals and components ~9 months after (March).
  notes: Release schedule at https://www.census.gov/programs-surveys/popest/about/schedule.html
change_detection:
  method: regex
  url: https://www2.census.gov/programs-surveys/popest/datasets/
  pattern: 'href="(2020-20\d\d)/"'
  poll_interval_days: 7
  notes: Fires when a new vintage directory appears (December, with state totals; county files follow in March). On change, confirm the county file exists and update coverage.time_range.end.
license:
  name: Creative Commons Zero 1.0 (public domain dedication), per census.gov data.json
  spdx: CC0-1.0
  url: https://creativecommons.org/publicdomain/zero/1.0/
  redistribution: allowed
  commercial_use: "yes"
  attribution: "U.S. Census Bureau, Population Estimates Program, Vintage <V> population and components of change estimates."
  evidence: evidence/licenses/census-pep/
  checked_at: "2026-11-24"
key_variables:
  - name: GEOID
    label: Geographic identifier
    definition: 2-digit state FIPS (geography=state) or 5-digit state+county FIPS (geography=county); null for nation/region/division (use REGION/DIVISION codes). Added by the adapter from STATE and COUNTY.
  - name: NAME
    label: Area name
    definition: Area name (publisher's NAME in the state file, CTYNAME in the county file). STNAME carries the state name for county rows.
  - name: POPESTIMATE<YEAR>
    label: Resident population, July 1
    unit: persons
    definition: Estimated resident population on July 1 of YEAR (2020..vintage). ESTIMATESBASE2020 is the April 1, 2020 base.
  - name: NPOPCHG<YEAR>
    label: Numeric population change
    unit: persons
    definition: Change in resident population over the estimate period ending July 1 of YEAR. The state file's NPOPCHG_<YEAR> is renamed to NPOPCHG<YEAR> by the adapter.
  - name: BIRTHS<YEAR> / DEATHS<YEAR> / NATURALCHG<YEAR>
    label: Births, deaths, natural change
    unit: persons
    definition: Components of change for the period ending July 1 of YEAR (2020 = April 1-June 30, 2020 only).
  - name: INTERNATIONALMIG<YEAR> / DOMESTICMIG<YEAR> / NETMIG<YEAR>
    label: Migration components
    unit: persons
    definition: Net international migration, net domestic (inter-county/state) migration, and their sum. Domestic migration is 0 at the national level by definition.
  - name: RESIDUAL<YEAR>
    label: Residual
    unit: persons
    definition: Change not attributable to a specific component (from controlling to national/state totals).
  - name: GQESTIMATES<YEAR>
    label: Group quarters population
    unit: persons
    definition: Estimated population in group quarters (prisons, dorms, nursing homes, military barracks) on July 1.
  - name: RBIRTH<YEAR> / RDEATH<YEAR> / RNETMIG<YEAR> (and RNATURALCHG, RINTERNATIONALMIG, RDOMESTICMIG)
    label: Rates
    unit: per 1,000 average population
    definition: Component rates per 1,000 mid-period population, from 2021 onward.
caveats:
  - Every vintage revises all prior years back to 2020. Never mix years taken from different vintages (e.g. POPESTIMATE2023 from vintage 2023 with POPESTIMATE2024 from vintage 2024); compare years within one vintage and cite the vintage.
  - The 2020 component columns cover only April 1 to June 30, 2020 (a quarter year); they are not comparable with full-year components for 2021 onward.
  - Vintage 2024 and later incorporate a revised (much higher) net international migration methodology; earlier vintages understate 2022-2023 immigration relative to them.
  - Estimates are model-based (cohort-component method), not counts, and are less reliable for small counties; they carry no published margins of error.
  - Connecticut's counties are its 9 planning regions (county-equivalents, FIPS 09110-09190) from vintage 2022 onward; the 8 legacy counties no longer appear. Check county FIPS changes (e.g. Alaska's Chugach/Copper River) before joining across years.
  - Puerto Rico appears only at state level (STATE 72, from the state file); PR municipios are published in a separate directory not served by this adapter. The county file has no PR rows.
  - Domestic migration is zero at the national level by construction; regions/divisions/states show net flows between them.
related: [census-acs-summary-file, census-saipe, census-gazetteer, data-commons]
status: healthy
status_reason: Onboarded; contract tests pass.
status_since: "2026-11-24"
last_verified: "2026-11-24"
adapter: census_pep
adapter_version: 1.0.0
