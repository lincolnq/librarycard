schema_version: 1
id: fhfa-hpi
name: FHFA House Price Index (HPI)
publisher:
  name: Federal Housing Finance Agency (FHFA)
  url: https://www.fhfa.gov
  type: us_federal
homepage: https://www.fhfa.gov/data/hpi
description: >-
  The FHFA House Price Index is a weighted repeat-sales index of single-family house prices, built from
  repeat sales (and, for the all-transactions flavor, refinance appraisals) on mortgages purchased or
  securitized by Fannie Mae and Freddie Mac since 1975; the expanded-data flavor adds FHA-insured loans and
  county recorder sales. FHFA publishes monthly and quarterly indexes for the nation, census divisions, states
  and metropolitan areas, and developmental annual indexes down to census tracts. This source adds metro and
  tract detail that headline national series lack.
domains: [housing, economy]
tags: [hpi, house-price-index, home-prices, repeat-sales, fhfa, ofheo, fannie-mae, freddie-mac, housing-market, appreciation, census-tract]
coverage:
  geography: United States — nation, 9 census divisions, 50 states and DC, ~410 metropolitan areas and divisions, state non-metro areas, Puerto Rico, census tracts (annual)
  countries: [US]
  geographic_granularity: [nation, census_division, state, metro_area, tract]
  time_range:
    start: "1975"
    end: null
    notes: All-transactions quarterly from 1975 (states/US; metros start later as data accumulate); purchase-only monthly from 1991; expanded-data from 1991; tract annual indexes start when a tract has enough sales (often late 1980s-2000s). Latest 2026Q3 (quarterly) as of 2026-11-24.
  temporal_granularity: quarterly
  unit_of_observation: Place x period (month or quarter) index value; for tracts, tract x year
access:
  method: bulk_download
  endpoints:
    - url: https://www.fhfa.gov/hpi/download/monthly/hpi_master.csv
      description: HPI master file (~17 MB) — every traditional/distress-free/non-metro/manufactured/developmental index for US, divisions, states, metros, Puerto Rico; monthly and quarterly; columns hpi_type, hpi_flavor, frequency, level, place_name, place_id, yr, period, index_nsa, index_sa, rstderr, note.
    - url: https://www.fhfa.gov/hpi/download/annual/hpi_at_tract.csv
      description: Annual developmental all-transactions indexes by census tract (~90 MB).
    - url: https://www.fhfa.gov/data/hpi/datasets
      description: Index of all HPI downloads (used by change detection).
  formats: [csv]
  rate_limits: None published. Files are downloaded on demand and not cached (link_only license); the tract file is ~90 MB per request.
  auth: none
  notes: Annual county, ZIP3 and ZIP5 indexes and several other series exist only as .xlsx and are not served by this adapter.
update:
  cadence: monthly
  expected_lag: Monthly purchase-only index ~2 months after the reference month; quarterly all-transactions/state/metro ~2 months after quarter end; annual tract indexes ~5 months after year end.
  notes: Schedule at https://www.fhfa.gov/data/hpi (release dates). Every release revises past values.
change_detection:
  method: regex
  url: https://www.fhfa.gov/data/hpi/datasets
  pattern: 'href="(/hpi/download/[^"]+)"'
  poll_interval_days: 7
  notes: Fingerprints the set of download links on the datasets page. It changes when files are added, removed, renamed or moved (the failure mode for this adapter), not on routine monthly refreshes that overwrite the same files.
license:
  name: U.S. Government work (FHFA website copyright notice; third-party exceptions)
  spdx: null
  url: https://www.fhfa.gov/about/fhfa-policies/website-privacy-policy
  redistribution: link_only
  commercial_use: unclear
  attribution: "Federal Housing Finance Agency, House Price Index. This product uses FHFA data but is neither endorsed nor certified by FHFA."
  evidence: evidence/licenses/fhfa-hpi/
  checked_at: "2026-11-24"
  notes: FHFA says its own materials are "generally" public domain but that some site information is purchased/licensed from third parties and users must identify it themselves; the expanded-data index uses county-recorder data. FHFA also requires services using its data to display a non-endorsement notice. Treated as link_only per POLICY (third-party content, conditions).
key_variables:
  - name: place_id
    definition: FHFA place code — 'USA', census division 'DV_xxx', state postal code, or CBSA / metropolitan division code (e.g. '31080' Los Angeles MSA).
  - name: place_name
    definition: Place name, e.g. 'Los Angeles-Long Beach-Anaheim, CA'; metros list all states they span.
  - name: yr
    definition: Year.
  - name: period
    definition: Month (1-12) for monthly series or quarter (1-4) for quarterly series.
  - name: index_nsa
    label: Index, not seasonally adjusted
    definition: Repeat-sales index, base period = 100 (1980Q1 for all-transactions states/US; 1991 for purchase-only).
  - name: index_sa
    label: Index, seasonally adjusted
    definition: Seasonally adjusted index (purchase-only and expanded-data flavors only; null otherwise).
  - name: rstderr
    definition: Standard error of the index; published in the master file only for expanded-data metro series (null elsewhere).
  - name: hpi_flavor
    definition: purchase-only (sales prices only), all-transactions (sales + refinance appraisals), expanded-data (adds FHA and county-recorder sales).
  - name: hpi
    label: Tract annual index
    definition: level=tract — annual index with the tract's first available year = 100; hpi1990 / hpi2000 rebased to 1990 / 2000; annual_change = percent change from the prior year.
caveats:
  - Index levels are not prices and have different base periods by place and flavor; an index of 300 in one metro and 250 in another does not mean houses cost more in the first. Compare percent changes over the same period.
  - Coverage is limited to conforming conventional mortgages bought by Fannie Mae/Freddie Mac (plus FHA and recorder data in expanded-data). Jumbo, cash and many low-end sales are excluded, so high-cost and investor-heavy markets are under-represented.
  - All-transactions indexes include refinance appraisals, which can lag or overstate market moves; prefer purchase-only for turning points.
  - Every release revises earlier periods (new repeat-sales pairs arrive late), so record the retrieval date and avoid mixing downloads from different releases.
  - Small metros and tracts have few repeat sales; notes like 'Fewer than 1,000 repeat-sales records' and null (suppressed) values flag unreliable periods. Tract indexes are developmental and noisy year to year.
  - Tract codes are 2020-vintage census tracts and metro codes follow current OMB CBSA delineations; joins to older geographies need crosswalks.
  - FHFA asks that services display "This product uses FHFA data but is neither endorsed nor certified by FHFA." (included in the attribution).
related: [census-acs-summary-file]
status: healthy
status_reason: Onboarded; contract tests pass.
status_since: "2026-11-24"
last_verified: "2026-11-24"
adapter: fhfa_hpi
adapter_version: 1.0.0
