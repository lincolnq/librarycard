[project]
name = "open-data-catalog"
version = "0.1.0"
description = "Find-and-fetch layer over high-quality public datasets, exposed as an MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
odc = "odc.cli:main"
odc-server = "odc.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real publisher over the network (contract tests). Deselect with -m 'not live'.",
]
addopts = "-ra"
