# Rebuild R2 mirrors for sources whose upstream changed (or that are missing / stale / have a new adapter_version).
# See docs/MIRROR.md. One job per due source, so a slow source (FEC: ~1.5 h) can't starve the others and each gets a
# fresh runner's disk. Failures, including jobs that time out, are filed as needs-repair issues.
name: mirror

on:
  schedule:
    - cron: "41 11 * * *"   # daily, after monitor.yml
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source ids to (re)build regardless of due-ness (blank = all due)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - id: plan
        env:
          SOURCES: ${{ inputs.sources }}   # via env, never interpolated into the script
        run: |
          if [ -n "$SOURCES" ]; then
            if ! printf '%s' "$SOURCES" | grep -Eq '^[a-z0-9 -]+$'; then
              echo "::error::sources must be space-separated catalog ids"; exit 2
            fi
            python -c 'import json,sys; print(json.dumps({"due": sys.argv[1:], "skipped": [], "failed": []}))' $SOURCES > reports-plan.json
          else
            odc mirror --due --plan --report reports-plan.json || true
            test -s reports-plan.json || { echo "::error::odc mirror --plan wrote no report"; exit 1; }
          fi
          cat reports-plan.json
          echo "sources=$(python -c 'import json; print(json.dumps(json.load(open("reports-plan.json"))["due"]))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mirror-plan
          path: reports-plan.json

  build:
    needs: plan
    if: needs.plan.outputs.sources != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3   # be polite to publishers
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: Free disk space (FEC needs ~10 GB of spool + packs)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Build and publish
        env:
          SOURCE: ${{ matrix.source }}
        run: odc mirror "$SOURCE" --report "reports/$SOURCE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-report-${{ matrix.source }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  issues:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - run: python scripts/merge_mirror_reports.py artifacts/mirror-plan/reports-plan.json artifacts/ reports/mirror.json && cat reports/mirror.json
      - name: File needs-repair issues for failed ingests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor/file_issues.py --changes /dev/null --contracts /dev/null --mirror reports/mirror.json
