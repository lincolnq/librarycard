# Daily upstream-change detection + rotating live contract tests.
# Findings become GitHub issues (labels: source-changed, needs-repair, needs-human)
# that Claude Code scheduled tasks pick up. See docs/RUNBOOKS.md.
#
# State (last fingerprints per source) lives on the orphan branch `monitor-state`
# (force-pushed, single commit). Reports are also uploaded as run artifacts.
name: monitor

on:
  schedule:
    - cron: "23 10 * * *"   # daily, 10:23 UTC
  workflow_dispatch:
    inputs:
      all:
        description: "Poll every source and run every contract (ignore schedule/rotation)"
        type: boolean
        default: false
      dry_run:
        description: "Do not open/comment on issues; just print the plan"
        type: boolean
        default: false

permissions:
  contents: write   # push the monitor-state branch
  issues: write     # open/update issues

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Load monitor state
        run: |
          mkdir -p monitor-state
          if git fetch --depth=1 origin monitor-state 2>/dev/null && git show FETCH_HEAD:state.json > monitor-state/state.json 2>/dev/null; then
            echo "loaded state for $(python -c 'import json;print(len(json.load(open("monitor-state/state.json"))))') sources"
          else
            echo '{}' > monitor-state/state.json; echo "no prior state; this run records baselines"
          fi
      - name: Detect upstream changes
        run: python monitor/detect_changes.py --state monitor-state/state.json --report reports/changes.json ${{ inputs.all && '--all' || '' }}
      - name: Run contract tests (rotating sample + quarantine retries)
        run: python monitor/run_contracts.py ${{ inputs.all && '--all' || '--sample 6' }} --report reports/contracts.json
      - name: File / update issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor/file_issues.py --changes reports/changes.json --contracts reports/contracts.json ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save monitor state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp reports/*.json monitor-state/ 2>/dev/null || true
          cd monitor-state
          git init -q -b monitor-state
          git add -A
          git -c user.name="odc-monitor" -c user.email="odc-monitor@users.noreply.github.com" commit -qm "monitor state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" monitor-state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-reports
          path: reports/
          retention-days: 30
