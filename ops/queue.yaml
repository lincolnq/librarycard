# Sources considered but not (yet) onboarded. A future agent may pick these up.
# reason: network | license | credentials | scope | low_priority | duplicate | format | unstable
#   network      - domain blocked in the agent environment (see docs/POLICY.md#network-access)
#   credentials  - needs a key/sign-up; give it a catalog-only `restricted` entry instead if useful
#   format       - only available in formats we can't parse with stdlib (e.g. xlsx-only, PDF tables)
#   low_priority - fine source, just not done yet
# Remove an entry when the source is onboarded (odc validate enforces this).
queued:
  - id: openstates-bulk-sessions
    name: Open States bulk legislative session data (bills, votes, events) — per-session CSV/JSON archives
    homepage: https://open.pluralpolicy.com/data/
    reason: credentials
    detail: >-
      Checked 2026-11-24. The per-session CSV and JSON archive pages (https://open.pluralpolicy.com/data/session-csv/,
      /data/session-json/) return HTTP 200 but say "Please log in to access download links" and contain no download URLs
      for anonymous users, so access requires an account (registration). The bucket root https://data.openstates.org/
      returns HTTP 403 AccessDenied (S3 directory listing disabled; not a proxy/network block). The monthly full
      Postgres dump (https://data.openstates.org/postgres/monthly/YYYY-MM-public.pgdump) is linked publicly but is pg_dump
      custom format (not stdlib-parseable; would also be a format issue). The Open States API v3 needs a key. License:
      data page says "Unless otherwise noted data is provided under a public domain dedication". If useful, a catalog-only
      restricted entry (registration_required) could be added.
    added: "2026-11-24"
  - id: openstates-legislators-current
    name: Open States current state legislators (per-state CSV)
    homepage: https://open.pluralpolicy.com/data/legislator-csv/
    reason: low_priority
    detail: >-
      Reachable without login on 2026-11-24: https://data.openstates.org/people/current/{state}.csv (e.g. ak.csv HTTP 200,
      54 KB; nightly). Source repo github.com/openstates/people is CC0 1.0; data page states a public domain dedication.
      Columns include official contact fields plus email, birth_date, biography and image — an adapter should drop
      birth_date/biography (or reduce to birth year) per the official-capacity rule. Not in this batch's scope; good
      next candidate (state legislators complement unitedstates-congress-legislators).
    added: "2026-11-24"
  - id: hud-egis-fair-market-rents
    name: HUD Fair Market Rents (HUD eGIS ArcGIS feature layer)
    homepage: https://hudgis-hud.opendata.arcgis.com/datasets/HUD::fair-market-rents
    reason: unstable
    detail: >-
      Keyless alternative to the restricted hud-fair-market-rents entry: ArcGIS FeatureServer
      https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/Fair_Market_Rents/FeatureServer/0 (2,622 FMR
      areas; FMR_CODE, FMR_AREANAME, FMR_0BDR..FMR_4BDR). Not onboarded because the layer carries no fiscal-year
      field (it is overwritten in place each year; dataLastEditDate 2025-09-30, so apparently FY2026 while FY2027 is
      current on 2026-11-24), has no county membership for metro FMR areas, and its only terms are a no-warranty
      disclaimer (would be link_only). Revisit if HUD adds an FY field or a keyless bulk CSV.
    added: "2026-11-24"
  - id: census-decennial-2020-dhc
    name: 2020 Census Demographic and Housing Characteristics File (DHC)
    homepage: https://www.census.gov/data/tables/2023/dec/2020-census-dhc.html
    reason: low_priority
    detail: >-
      Keyless bulk files exist on www2.census.gov (programs-surveys/decennial/2020/data/demographic-and-housing-characteristics-file/<State>/<st>2020.dhc.zip,
      legacy pipe-delimited format: geo header plus dozens of data segments and hundreds of tables). The
      census-decennial-2020-pl adapter's approach (geo header + LOGRECNO join, field names from the Census import
      scripts) would extend to it, but the table/segment map is much larger and zips are big (DE 34 MB, CA 1.06 GB,
      close to ODC_MAX_DOWNLOAD_BYTES=1.5 GB and too slow for on-demand fetches of large states).
      Not built in the 2026-11-24 demographics batch for time; PL 94-171 (census-decennial-2020-pl) covers the core counts.
    added: "2026-11-24"
