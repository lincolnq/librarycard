schema_version: 1
id: fema-disaster-declarations
name: FEMA Disaster Declarations Summaries (OpenFEMA)
publisher:
  name: Federal Emergency Management Agency (FEMA)
  url: https://www.fema.gov/about/openfema
  type: us_federal
homepage: https://www.fema.gov/openfema-data-page/disaster-declarations-summaries-v2
description: >-
  Every federally declared disaster since 1953 — major disasters (DR), emergencies (EM) and fire
  management assistance (FM) — with the counties or tribal areas designated and the assistance programs
  (individual assistance, public assistance, hazard mitigation) declared for each. Produced from FEMA's
  internal NEMIS system and published through the OpenFEMA API, refreshed roughly every 20 minutes.
domains: [disasters_emergency, government_spending]
tags: [fema, disaster-declarations, stafford-act, hurricanes, floods, wildfires, county]
coverage:
  geography: United States, territories and tribal nations
  countries: [US]
  geographic_granularity: [state, county, event]
  time_range:
    start: "1953-05"
    end: null
    notes: County-level designations not available before 1964. Fire management records are partial for early years.
  temporal_granularity: continuous
  unit_of_observation: Designated area (usually a county) within one disaster declaration
access:
  method: api
  endpoints:
    - url: https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries
      description: OData-style REST endpoint ($filter, $orderby, $top up to 10,000, $skip, $inlinecount)
    - url: https://www.fema.gov/api/open/v1/OpenFemaDataSets
      description: Dataset metadata catalog (versions, deprecation notices, last refresh)
  formats: [json, csv, parquet]
  rate_limits: None published; $top max 10,000 per call.
  auth: none
update:
  cadence: continuous
  expected_lag: Minutes to hours after a declaration.
change_detection:
  method: json_field
  url: https://www.fema.gov/api/open/v1/OpenFemaDataSets
  params:
    $filter: "name eq 'DisasterDeclarationsSummaries' and version eq 2"
  json_path:
    - "OpenFemaDataSets[0].modified"
    - "OpenFemaDataSets[0].depDate"
    - "OpenFemaDataSets[0].depApiMessage"
    - "OpenFemaDataSets[0].depNewURL"
    - "OpenFemaDataSets[0].dataDictionary"
  poll_interval_days: 7
  notes: Watches the dataset definition (modified date) and deprecation fields, not lastDataSetRefresh, which changes every ~20 minutes. A deprecation notice means a new API version is coming — update the adapter.
license:
  name: OpenFEMA Terms and Conditions
  spdx: null
  url: https://www.fema.gov/about/openfema/terms-conditions
  redistribution: link_only
  commercial_use: unclear
  attribution: >-
    Federal Emergency Management Agency (FEMA), OpenFEMA Dataset: Disaster Declarations Summaries - v2.
    This product uses the Federal Emergency Management Agency's OpenFEMA API, but is not endorsed by FEMA.
    The Federal Government or FEMA cannot vouch for the data or analyses derived from these data after the
    data have been retrieved from the Agency's website(s).
  evidence: evidence/licenses/fema-disaster-declarations/
  checked_at: "2026-11-24"
  notes: Terms restrict use to statistical research or reporting and let FEMA demand deletion of copies; classified link_only per POLICY.
key_variables:
  - name: disasterNumber
    definition: FEMA disaster number. 1-1999 and 4000-4999 major disasters, 3000-3999 emergencies, 2000-2999 and 5000-5999 fire management.
  - name: femaDeclarationString
    definition: Declaration id such as DR-4332-TX (type-number-state).
  - name: declarationType
    definition: DR (major disaster), EM (emergency), FM (fire management assistance).
  - name: declarationDate
    unit: ISO 8601 UTC timestamp
    definition: Date the declaration was made.
  - name: incidentType
    definition: Primary incident type (Hurricane, Flood, Fire, Severe Storm, Biological, ...).
  - name: fipsStateCode / fipsCountyCode
    definition: FIPS codes of the designated area. fipsCountyCode '000' means a statewide designation.
  - name: ihProgramDeclared / iaProgramDeclared / paProgramDeclared / hmProgramDeclared
    definition: Whether Individuals & Households, Individual Assistance, Public Assistance and Hazard Mitigation programs were declared for this area.
caveats:
  - One row per designated area per declaration, not per disaster. Count distinct disasterNumber values to count disasters; counting rows counts county designations.
  - COVID-19 (2020) produced emergency and major-disaster declarations for every state and territory (incidentType 'Biological'); exclude or treat separately in trend analyses.
  - Declarations are political/administrative decisions (governor request + presidential approval), not a measure of hazard severity; trends reflect policy and thresholds as well as events.
  - fipsCountyCode '000' denotes statewide designation; tribal designations may have no county FIPS.
  - Records before 1964 lack county designations; fire management (FM) records are partial for early decades.
  - Data are a live administrative system — designations can be amended after the original declaration; record retrieval time (provenance.retrieved_at) when citing.
related: [noaa-nclimgrid-daily]
status: healthy
status_reason: Onboarded; contract tests pass.
status_since: "2026-11-24"
last_verified: "2026-11-24"
adapter: fema_disaster_declarations
adapter_version: 1.0.0
