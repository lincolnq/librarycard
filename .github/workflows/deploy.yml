# Deploy the production MCP Worker (https://mcp.librarycard.net/mcp) on merge to main.
name: deploy

on:
  push:
    branches: [main]
    paths: ["worker/**", "catalog/**", "src/odc/**", "schema/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: pip install -e ".[dev]"
      - run: odc validate
      - run: pytest -m "not live" -q
      - working-directory: worker
        run: npm ci && npm run export && npm test
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          sleep 5
          curl -sf https://mcp.librarycard.net/healthz
          curl -sf https://mcp.librarycard.net/mcp -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q search_catalog
